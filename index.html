<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Para Meu Amor">
    <link rel="apple-touch-icon" href="icone.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#170609">
    <link rel="manifest" href="manifest.json">

    <title>Para Meu Amor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* Rosa & coral — paleta (baseada em #FF6863), agora com um toque de rosinha fofo */
            --bg-top: #5a1727;
            --bg-bottom: #1b0710;
            --rose: #FF6863;
            --rose-soft: #FFADA6;
            --pink: #FF9EBB;
            --pink-soft: #FFD3E0;
            --rose-dim: rgba(255, 104, 99, 0.35);
            --ivory: #FFF3EF;
            --blush: #FFC4BD;
            --ink: #3a0908;

            --spring: cubic-bezier(.34, 1.5, .64, 1);
            --slide: cubic-bezier(.2, 1.12, .3, 1);

            --bg-gradient:
                radial-gradient(circle at 18% 12%, rgba(255, 158, 187, 0.22), transparent 44%),
                radial-gradient(circle at 88% 82%, rgba(255, 154, 140, 0.38), transparent 50%),
                linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);

            --track-opacity: 0.25;
        }

        body {
            font-family: 'Quicksand', 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-color: var(--bg-bottom);
            color: var(--ivory);
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        h1, h2, h3 {
            font-family: 'Dancing Script', 'Playfair Display', cursive, serif;
            font-weight: 700;
            font-style: normal;
            letter-spacing: 0.3px;
        }

        /* ===== Animações compartilhadas ===== */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            14% { transform: scale(1.25); }
            28% { transform: scale(1); }
            42% { transform: scale(1.18); }
            70% { transform: scale(1); }
        }
        @keyframes popIn {
            0% { opacity: 0; transform: translateY(18px) scale(0.86); }
            100% { opacity: 1; transform: none; }
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0) rotate(-0.6deg); }
            50% { transform: translateY(-7px) rotate(0.6deg); }
        }

        /* Divisor ornamental — agora com coraçãozinho pulsando */
        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 68%;
            max-width: 210px;
            margin: 10px auto 20px;
        }
        .ornament::before, .ornament::after {
            content: '';
            flex: 1;
            height: 2px;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--pink), transparent);
        }
        .ornament-dot {
            flex-shrink: 0;
            color: var(--rose);
            font-size: 15px;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 104, 99, 0.75);
            animation: heartbeat 1.8s ease-in-out infinite;
        }
        .ornament-dot::before { content: '❤'; }

        /* ===== Camada ambiente: manchas de luz que se transformam ===== */
        .ambient-glow {
            position: fixed;
            inset: 0;
            z-index: 45;
            pointer-events: none;
            overflow: hidden;
        }
        .blob {
            position: absolute;
            filter: blur(50px);
            mix-blend-mode: screen;
            opacity: 0.5;
            border-radius: 42% 58% 63% 37% / 45% 40% 60% 55%;
            will-change: transform, border-radius;
        }
        .blob-a {
            width: 270px; height: 270px;
            background: radial-gradient(circle, rgba(255, 104, 99, 0.55), transparent 70%);
            top: -70px; left: -50px;
            animation: morph 13s ease-in-out infinite alternate, driftA 17s ease-in-out infinite alternate;
        }
        .blob-b {
            width: 310px; height: 310px;
            background: radial-gradient(circle, rgba(255, 173, 166, 0.45), transparent 70%);
            bottom: -90px; right: -70px;
            animation: morph 16s ease-in-out infinite alternate-reverse, driftB 21s ease-in-out infinite alternate;
        }
        .blob-c {
            width: 220px; height: 220px;
            background: radial-gradient(circle, rgba(255, 158, 187, 0.45), transparent 70%);
            top: 42%; left: 55%;
            animation: morph 19s ease-in-out infinite alternate, driftC 24s ease-in-out infinite alternate;
        }
        @keyframes morph {
            0% { border-radius: 42% 58% 63% 37% / 45% 40% 60% 55%; }
            33% { border-radius: 60% 40% 38% 62% / 55% 62% 38% 45%; }
            66% { border-radius: 38% 62% 55% 45% / 62% 38% 62% 38%; }
            100% { border-radius: 55% 45% 40% 60% / 40% 58% 42% 60%; }
        }
        @keyframes driftA {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 35px) scale(1.18); }
        }
        @keyframes driftB {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-40px, -45px) scale(1.12); }
        }
        @keyframes driftC {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-70px, 40px) scale(1.25); }
        }

        /* ===== Estrelinhas piscando ===== */
        .sparkle-field {
            position: fixed;
            inset: 0;
            z-index: 47;
            pointer-events: none;
            overflow: hidden;
        }
        .sparkle {
            position: absolute;
            color: var(--pink-soft);
            text-shadow: 0 0 8px rgba(255, 200, 215, 0.9);
            opacity: 0;
            animation: twinkle var(--dur, 3.5s) ease-in-out var(--delay, 0s) infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0; transform: scale(0.4) rotate(0deg); }
            50% { opacity: 0.9; transform: scale(1.1) rotate(90deg); }
        }

        /* ===== Corações e florzinhas flutuando (sobem reto, balançam de lado) ===== */
        .hearts-field {
            position: fixed;
            inset: 0;
            z-index: 46;
            pointer-events: none;
            overflow: hidden;
        }
        .floating-heart {
            position: absolute;
            bottom: -34px;
            color: var(--pink);
            opacity: 0;
            animation: floatUp linear forwards;
            text-shadow: 0 0 10px rgba(255, 104, 99, 0.35);
        }
        .floating-heart > span {
            display: inline-block;
            animation: sway var(--sway-dur, 3.2s) ease-in-out infinite alternate;
        }
        @keyframes floatUp {
            0% { transform: translateY(0); opacity: 0; }
            8% { opacity: 0.75; }
            88% { opacity: 0.5; }
            100% { transform: translateY(-112vh); opacity: 0; }
        }
        @keyframes sway {
            0% { transform: translateX(calc(var(--sway, 20px) * -1)) rotate(-12deg); }
            100% { transform: translateX(var(--sway, 20px)) rotate(12deg); }
        }

        /* ===== Explosão / toque / rastro ===== */
        .burst-heart {
            position: fixed;
            z-index: 60;
            pointer-events: none;
            color: var(--rose);
            text-shadow: 0 0 8px rgba(255, 104, 99, 0.5);
            animation: burstOut 0.95s cubic-bezier(.2, .8, .3, 1) forwards;
        }
        @keyframes burstOut {
            0% { transform: translate(-50%, -50%) scale(0.4); opacity: 1; }
            100% { transform: translate(calc(-50% + var(--bx)), calc(-50% + var(--by))) scale(1.15) rotate(var(--rot, 0deg)); opacity: 0; }
        }
        .trail-spark {
            position: fixed;
            z-index: 60;
            pointer-events: none;
            color: var(--pink-soft);
            text-shadow: 0 0 8px rgba(255, 158, 187, 0.95);
            animation: trailFade 0.7s ease-out forwards;
        }
        @keyframes trailFade {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.95; }
            100% { transform: translate(-50%, calc(-50% + 20px)) scale(0.2) rotate(120deg); opacity: 0; }
        }

        /* ===================== TELA 1 — BLOQUEIO ===================== */
        #lock-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: var(--bg-gradient);
            z-index: 1;
            text-align: center;
            gap: 5vh;
        }

        #greeting {
            font-size: 3.2rem;
            color: var(--ivory);
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.5), 0 0 26px rgba(255, 158, 187, 0.4);
            line-height: 1.15;
            max-width: 92%;
        }
        #greeting .word { display: inline-block; white-space: nowrap; }
        #greeting .ch {
            display: inline-block;
            animation: waveChar 2.8s ease-in-out infinite;
            animation-delay: calc(var(--i) * 90ms);
        }
        @keyframes waveChar {
            0%, 60%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            30% { transform: translateY(-8px) rotate(-3deg) scale(1.07); }
        }

        .slider-wrapper {
            width: 100%;
            max-width: 290px;
            text-align: center;
            z-index: 10;
        }

        .slider-text {
            font-size: 1rem;
            color: var(--blush);
            margin-bottom: 18px;
            font-weight: 500;
            letter-spacing: 0.8px;
            animation: slideHint 2.5s infinite ease-in-out;
        }
        .slider-text::after {
            content: ' ♡';
            display: inline-block;
            animation: heartbeat 1.6s ease-in-out infinite;
        }

        @keyframes slideHint {
            0% { transform: translateX(-4px); opacity: 0.45; }
            50% { transform: translateX(4px); opacity: 1; }
            100% { transform: translateX(-4px); opacity: 0.45; }
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 56px;
            background: linear-gradient(90deg, rgba(255, 104, 99, var(--track-opacity)), rgba(255, 158, 187, var(--track-opacity)));
            border-radius: 30px;
            outline: none;
            transition: background 0.05s linear;
            box-shadow: inset 0 0 0 1px rgba(255, 158, 187, 0.35), inset 0 2px 12px rgba(255, 255, 255, 0.06), 0 6px 22px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--rose);
            background-image:
                radial-gradient(circle at 34% 30%, var(--pink-soft), var(--rose) 60%, #cc3f3a 100%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="%233a0908"><path d="M12 21s-7.5-4.6-10-9.3C.6 8 2.4 4.5 6 4.5c2 0 3.6 1.1 4.5 2.6C11.4 5.6 13 4.5 15 4.5c3.6 0 5.4 3.5 4 7.2C19.5 16.4 12 21 12 21z"/></svg>');
            background-repeat: no-repeat;
            background-position: center, center;
            background-size: cover, 23px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(255, 211, 224, 0.12);
            transition: transform 0.1s;
            animation: thumbPulse 2s ease-out infinite;
        }
        @keyframes thumbPulse {
            0% { box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(255, 211, 224, 0.12), 0 0 0 0 rgba(255, 104, 99, 0.55); }
            70%, 100% { box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(255, 211, 224, 0.12), 0 0 0 16px rgba(255, 104, 99, 0); }
        }

        .kitty-container {
            position: absolute;
            bottom: 25px;
            width: 85px;
            height: auto;
            opacity: 0.85;
            pointer-events: none;
            z-index: 5;
        }

        .kitty-container::before {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            background: radial-gradient(circle, rgba(255, 158, 187, 0.4), transparent 70%);
            filter: blur(5px);
            z-index: -1;
        }

        /* coraçãozinho que sobe da Kitty */
        .kitty-container::after {
            content: '💕';
            position: absolute;
            top: -14px;
            left: 50%;
            font-size: 16px;
            opacity: 0;
            animation: kittyLove 2.8s ease-in-out infinite;
        }
        .kitty-right::after { animation-delay: 1.4s; }
        @keyframes kittyLove {
            0% { transform: translate(-50%, 8px) scale(0.5); opacity: 0; }
            30% { opacity: 0.95; }
            100% { transform: translate(-50%, -28px) scale(1.1); opacity: 0; }
        }

        .kitty-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .kitty-right img {
            transform: scaleX(-1);
        }

        .kitty-left {
            left: 20px;
            transform-origin: bottom center;
            animation: smoothTiltLeft 5s infinite alternate ease-in-out, hop 2.6s ease-in-out infinite;
        }
        .kitty-right {
            right: 20px;
            transform-origin: bottom center;
            animation: smoothTiltRight 5s infinite alternate ease-in-out, hop 2.6s ease-in-out 1.3s infinite;
        }

        @keyframes smoothTiltLeft {
            0% { transform: rotate(-22deg); }
            100% { transform: rotate(22deg); }
        }

        @keyframes smoothTiltRight {
            0% { transform: rotate(22deg); }
            100% { transform: rotate(-22deg); }
        }

        @keyframes hop {
            0%, 100% { translate: 0 0; }
            50% { translate: 0 -9px; }
        }

        /* ===================== TELA 2 — MENSAGEM ===================== */
        #message-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            background-color: var(--bg-bottom);
            color: var(--ivory);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px 24px;
            text-align: center;

            transform: translateY(100%);
            transition: transform 0.95s var(--slide), border-radius 0.95s ease;
            border-top-left-radius: 40px;
            border-top-right-radius: 40px;
            box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.7);
        }

        #message-screen.unlocked {
            transform: translateY(0);
            border-radius: 0;
        }

        .message-content {
            width: 100%;
            max-width: 350px;
            max-height: 100%;
            overflow-y: auto;
            padding: 10px 12px;
            opacity: 0;
            transform: translateY(24px) scale(0.94);
            transition: opacity 0.8s ease 0.4s, transform 0.9s var(--spring) 0.4s;
        }
        .message-content::-webkit-scrollbar { display: none; }

        #message-screen.unlocked .message-content {
            opacity: 1;
            transform: none;
        }

        .mail-icon {
            font-size: 2.3rem;
            line-height: 1;
            animation: mailFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 10px rgba(255, 104, 99, 0.45));
        }
        @keyframes mailFloat {
            0%, 100% { transform: translateY(0) rotate(-6deg); }
            50% { transform: translateY(-8px) rotate(6deg); }
        }

        .message-content h2 {
            font-size: 2.5rem;
            color: var(--pink-soft);
            text-shadow: 0 0 22px rgba(255, 158, 187, 0.35);
        }

        /* A frase vira uma "cartinha" com laço e coraçãozinho */
        .letter {
            position: relative;
            margin: 22px 0 6px;
            padding: 28px 22px 26px;
            border-radius: 28px;
            background: linear-gradient(160deg, rgba(255, 243, 239, 0.11), rgba(255, 158, 187, 0.08));
            border: 1px solid rgba(255, 173, 166, 0.3);
            -webkit-backdrop-filter: blur(8px);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.14);
        }
        .letter::before {
            content: '🎀';
            position: absolute;
            z-index: 3;
            top: -17px;
            left: 50%;
            font-size: 28px;
            line-height: 1;
            transform: translateX(-50%) rotate(-6deg);
            animation: bowWiggle 3.4s ease-in-out infinite;
        }
        @keyframes bowWiggle {
            0%, 100% { transform: translateX(-50%) rotate(-7deg); }
            50% { transform: translateX(-50%) rotate(7deg) scale(1.08); }
        }
        .letter::after {
            content: '💗';
            position: absolute;
            z-index: 3;
            right: -4px;
            bottom: -12px;
            font-size: 22px;
            line-height: 1;
            animation: heartbeat 1.6s ease-in-out infinite;
        }

        .message-content p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.4rem;
            line-height: 1.6;
            color: var(--ivory);
            font-weight: 500;
        }
        .message-content p.len-m { font-size: 1.25rem; line-height: 1.55; }
        .message-content p.len-l { font-size: 1.08rem; line-height: 1.5; }

        /* ===== Raspadinha: a frase fica escondida até raspar ===== */
        .letter-glow {
            position: absolute;
            inset: -16px;
            z-index: -1;
            border-radius: 44px;
            background: radial-gradient(closest-side, rgba(255, 227, 234, 0.85), rgba(255, 158, 187, 0.4) 55%, transparent 100%);
            filter: blur(10px);
            opacity: 0;
            pointer-events: none;
        }
        .scratch-wrap {
            position: absolute;
            inset: 0;
            z-index: 2;
            border-radius: inherit;
            overflow: hidden;
            pointer-events: none;
        }
        .scratch-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            pointer-events: auto;
            cursor: pointer;
            transition: opacity 1.1s ease, filter 1.1s ease, transform 1.1s cubic-bezier(.16, 1, .3, 1);
        }
        /* brilho que passeia pela capa chamando pra raspar */
        .scratch-shine {
            position: absolute;
            top: 0;
            bottom: 0;
            left: -60%;
            width: 45%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: skewX(-18deg);
            opacity: 0;
            pointer-events: none;
            animation: idleShine 3.8s ease-in-out 0.8s infinite;
        }
        @keyframes idleShine {
            0%, 55% { left: -60%; opacity: 0; }
            65% { opacity: 0.55; }
            100% { left: 130%; opacity: 0; }
        }
        .letter.scratched .scratch-shine { animation: none; opacity: 0; }

        /* desbloqueio suave: capa derrete, luz passa pelo cartão e o texto brilha */
        .letter.revealed .scratch-canvas {
            opacity: 0;
            filter: blur(8px);
            transform: scale(1.06);
            pointer-events: none;
        }
        .letter.revealed .scratch-shine {
            animation: unlockShine 1.5s ease-out 0.1s forwards;
        }
        @keyframes unlockShine {
            0% { left: -60%; opacity: 0; }
            20% { opacity: 0.9; }
            100% { left: 130%; opacity: 0; }
        }
        .letter.revealed .letter-glow {
            animation: glowPulse 2s ease-out forwards;
        }
        @keyframes glowPulse {
            0% { opacity: 0; transform: scale(0.85); }
            30% { opacity: 1; }
            100% { opacity: 0; transform: scale(1.3); }
        }
        .letter.revealed {
            animation: letterBloom 2s ease-out;
        }
        @keyframes letterBloom {
            0%, 100% { box-shadow: 0 8px 22px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.14); }
            35% { box-shadow: 0 0 56px rgba(255, 158, 187, 0.75), 0 0 22px rgba(255, 255, 255, 0.35), inset 0 0 30px rgba(255, 255, 255, 0.18); }
        }
        .letter.revealed p {
            animation: textGlow 2.2s ease-out;
        }
        @keyframes textGlow {
            0% { text-shadow: 0 0 20px rgba(255, 211, 224, 0.95); }
            100% { text-shadow: 0 0 0 rgba(255, 211, 224, 0); }
        }

        .close-btn {
            position: relative;
            overflow: hidden;
            margin-top: 26px;
            padding: 13px 34px;
            background: rgba(255, 158, 187, 0.12);
            border: 1.5px solid var(--pink);
            color: var(--ivory);
            border-radius: 999px;
            font-family: 'Quicksand', 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
            transition: transform 0.35s var(--spring), background 0.2s ease, color 0.2s ease;
        }

        .close-btn:active {
            background: var(--pink);
            color: var(--ink);
            transform: scale(0.9);
        }

        .close-btn.accent-btn {
            background: linear-gradient(135deg, var(--pink-soft), var(--rose) 80%);
            color: var(--ink);
            font-weight: 700;
            border-color: transparent;
            box-shadow: 0 8px 22px rgba(255, 104, 99, 0.4);
        }
        .close-btn.accent-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.55), transparent);
            transform: skewX(-20deg);
            animation: sheen 3.6s ease-in-out infinite;
        }
        @keyframes sheen {
            0%, 55% { left: -60%; }
            100% { left: 140%; }
        }
        .close-btn.accent-btn:active {
            filter: brightness(0.94);
            transform: scale(0.9);
        }

        /* ===================== TELA 3 — CONTADOR ===================== */
        #counter-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            background-color: var(--bg-bottom);
            color: var(--ivory);
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px;
            text-align: center;

            transform: translateY(100%);
            transition: transform 0.95s var(--slide);
        }

        #counter-screen.active {
            transform: translateY(0);

        return (typeof text === "string" && text.trim() !== "") ? text.trim() : "";

    // 3. CONTADOR DE DIAS (Anos, Meses e Dias)
    const START_DATE = new Date("2026-04-25T00:00:00");

    function calculateDaysTogether() {
        const startDate = START_DATE;
        const today = new Date();

        startDate.setHours(0,0,0,0);
        today.setHours(0,0,0,0);

        let years = today.getFullYear() - startDate.getFullYear();
        let months = today.getMonth() - startDate.getMonth();
        let days = today.getDate() - startDate.getDate();

        if (days < 0) {
            months--;
            const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
            days += prevMonth.getDate();
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        let parts = [];

        if (years > 0) {
            parts.push(years === 1 ? "1 Ano" : `${years} Anos`);
        }
        if (months > 0) {
            parts.push(months === 1 ? "1 mês" : `${months} meses`);
        }
        if (days > 0) {
            parts.push(days === 1 ? "1 dia" : `${days} dias`);
        }

        let resultText = "";
        if (parts.length === 1) {
            resultText = parts[0];
        } else if (parts.length === 2) {
            resultText = parts[0] + " e " + parts[1];
        } else if (parts.length === 3) {
            resultText = parts[0] + ", " + parts[1] + " e " + parts[2];
        } else {
            resultText = "0 dias";
        }

        document.getElementById("days-count").innerText = resultText;
        checkAnniversaryBadge();
    }

        const today = new Date();
        const isSameMonthAsStart =
            today.getFullYear() === START_DATE.getFullYear() &&
            today.getMonth() === START_DATE.getMonth();
        const isAnniversaryDay = today.getDate() === START_DATE.getDate() && !isSameMonthAsStart;
        badge.style.display = isAnniversaryDay ? "inline-flex" : "none";
    }

    // 3b. GALERIA
    const MONTH_NAMES = ["janeiro","fevereiro","março","abril","maio","junho",
                          "julho","agosto","setembro","outubro","novembro","dezembro"];

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function currentMonthKey() {
        const now = new Date();
        return monthKeyOf(now.getFullYear(), now.getMonth());
    }

    // Frases que a Galeria pode mostrar para um mês: só dias com frase escrita
    // e que já chegaram (no mês atual, até hoje). Do dia mais novo pro mais antigo.
    function getGalleryEntries(key) {
        const [year, month] = key.split("-").map(Number);
        const isCurrent = key === currentMonthKey();
        const lastDay = isCurrent ? new Date().getDate() : 31;
        const entries = [];
        for (let d = lastDay; d >= 1; d--) {
            const text = getRealMessage(d, month - 1, year);
            if (text) entries.push({ day: d, text });
        }
        return entries;
    }

    // Só entram meses que já começaram e que têm pelo menos uma frase.
    // Mais recente primeiro.
    function getAvailableMonths() {
        const curKey = currentMonthKey();
        const keys = new Set(Object.keys(monthlyMessages));
        keys.add(curKey);
        return Array.from(keys)
            .filter(k => k <= curKey && getGalleryEntries(k).length > 0)
            .sort((a, b) => b.localeCompare(a));
    }

    function monthLabel(key) {
        const [year, month] = key.split("-").map(Number);
        const name = MONTH_NAMES[month - 1];
        return `${name.charAt(0).toUpperCase()}${name.slice(1)} ${year}`;
    }

    function populateMonthSelect(months) {
        const select = document.getElementById("gallery-month-select");
        const curKey = currentMonthKey();
        select.innerHTML = months.map(key => {
            const label = monthLabel(key) + (key === curKey ? " (atual)" : "");
            return `<option value="${key}">${label}</option>`;
        }).join("");
    }

    function updateGallerySubtitle(key) {
        const sub = document.getElementById("gallery-subtitle");
        if (!key) {
            sub.innerText = "Tudo que já te disse";
            return;
        }
        const [year, month] = key.split("-").map(Number);
        const monthName = MONTH_NAMES[month - 1];
        sub.innerText = key === currentMonthKey()
            ? `Tudo que já te disse em ${monthName}`
            : `Minhas frases de ${monthName} de ${year}`;
    }

    function renderGalleryForMonth(key) {
        const list = document.getElementById("gallery-list");
        updateGallerySubtitle(key);

        const entries = key ? getGalleryEntries(key) : [];
        if (entries.length === 0) {
            list.innerHTML = `<p class="gallery-empty">Nenhuma frase guardada ainda.</p>`;
            return;
        }

        const monthName = MONTH_NAMES[Number(key.split("-")[1]) - 1];
        list.scrollTop = 0;
        list.innerHTML = entries.map((e, idx) => `
            <div class="gallery-entry" style="--i:${Math.min(idx, 12)}">
                <div class="gallery-badge">${e.day}</div>
                <div class="gallery-entry-content">
                    <span class="gallery-date">${e.day} de ${monthName}</span>
                    <p class="gallery-text">${escapeHtml(e.text)}</p>
                </div>
            </div>`).join("");
    }

    function resetSlider() {
        if (slider.value <= 95) {

            const interval = setInterval(() => {
                if (val > 0) {
                    val -= 12;
                    if (val < 0) val = 0;
                    slider.value = val;
                    const dynamicOpacity = ((100 - val) / 100) * 0.25;
                    document.documentElement.style.setProperty('--track-opacity', dynamicOpacity);
                } else {
                    clearInterval(interval);
                }
            }, 10);
        }
    }

    function emitParticles(x, y, opts) {
        if (reduceMotion) return;
        for (let i = 0; i < opts.count; i++) {
            const h = document.createElement("span");
            h.className = "burst-heart";
            h.textContent = pick(BURST_ITEMS);
            h.style.left = x + "px";
            h.style.top = y + "px";
            h.style.fontSize = (opts.size[0] + Math.random() * (opts.size[1] - opts.size[0])) + "px";
            const angle = (Math.PI * 2 * i) / opts.count + Math.random() * 0.4;
            const dist = opts.minDist + Math.random() * (opts.maxDist - opts.minDist);
            h.style.setProperty("--bx", Math.cos(angle) * dist + "px");
            h.style.setProperty("--by", (Math.sin(angle) * dist - 30) + "px");
            h.style.setProperty("--rot", (Math.random() * 60 - 30) + "deg");

            h.addEventListener("animationend", () => h.remove());

    }

    // Capa: rosa perolado com coraçõezinhos, glitter e um brilho diagonal
    function paintScratchCover(ctx, w, h) {
        const g = ctx.createLinearGradient(0, 0, w, h);
        g.addColorStop(0, "#ffd9e4");
        g.addColorStop(0.3, "#ff9ebb");
        g.addColorStop(0.55, "#ffc4d2");
        g.addColorStop(0.8, "#ff8fa3");
        g.addColorStop(1, "#ffb8c8");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = "rgba(255, 255, 255, 0.28)";
        ctx.font = "16px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        for (let y = 14, row = 0; y < h; y += 30, row++) {
            for (let x = (row % 2 ? 14 : 29); x < w; x += 30) ctx.fillText("♥", x, y);
        }

        const dots = Math.round((w * h) / 260);
        for (let i = 0; i < dots; i++) {
            ctx.fillStyle = Math.random() < 0.7
                ? `rgba(255, 255, 255, ${0.15 + Math.random() * 0.5})`
                : `rgba(255, 104, 99, ${0.1 + Math.random() * 0.25})`;
            ctx.beginPath();
            ctx.arc(Math.random() * w, Math.random() * h, 0.6 + Math.random() * 1.1, 0, Math.PI * 2);
            ctx.fill();
        }

        const s = ctx.createLinearGradient(0, 0, w, h * 0.6);
        s.addColorStop(0.35, "rgba(255, 255, 255, 0)");
        s.addColorStop(0.5, "rgba(255, 255, 255, 0.32)");
        s.addColorStop(0.65, "rgba(255, 255, 255, 0)");
        ctx.fillStyle = s;
        ctx.fillRect(0, 0, w, h);

        ctx.save();
        ctx.shadowColor = "rgba(255, 255, 255, 0.75)";
        ctx.shadowBlur = 8;
        ctx.fillStyle = "#8a2b45";
        ctx.font = "700 36px 'Dancing Script', cursive";
        ctx.fillText("raspe aqui", w / 2, h / 2 - 8);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(138, 43, 69, 0.78)";
        ctx.font = "600 14px 'Quicksand', sans-serif";
        ctx.fillText("✨ revele a sua mensagem ✨", w / 2, h / 2 + 26);
        ctx.restore();
    }

    // Pincel macio (bordas esfumadas) usado como carimbo ao longo do dedo
    function makeScratchBrush(r) {
        const c = document.createElement("canvas");
        c.width = c.height = r * 2;
        const x = c.getContext("2d");
        const g = x.createRadialGradient(r, r, r * 0.15, r, r, r);
        g.addColorStop(0, "rgba(0, 0, 0, 1)");
        g.addColorStop(0.6, "rgba(0, 0, 0, 0.95)");
        g.addColorStop(1, "rgba(0, 0, 0, 0)");
        x.fillStyle = g;
        x.fillRect(0, 0, r * 2, r * 2);
        return c;
    }

    // Quanto da capa ainda existe (0 a 1), amostrando a cada 4px
    function measureScratchAlpha() {
        const { ctx, w, h } = scratch;
        const d = ctx.getImageData(0, 0, w, h).data;
        let sum = 0, count = 0;
        for (let y = 0; y < h; y += 4) {
            for (let x = 0; x < w; x += 4) {
                sum += d[(y * w + x) * 4 + 3];
                count++;
            }
        }
        return count ? sum / count / 255 : 0;
    }

    function setupScratchCard() {
        const letter = document.getElementById("letter");
        const canvas = document.getElementById("scratch-canvas");
        if (scratch.hideTimer) { clearTimeout(scratch.hideTimer); scratch.hideTimer = null; }
        letter.classList.remove("revealed", "scratched");

        const cssW = letter.offsetWidth, cssH = letter.offsetHeight;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.style.display = "";
        canvas.width = Math.round(cssW * dpr);
        canvas.height = Math.round(cssH * dpr);
        const ctx = canvas.getContext("2d", { willReadFrequently: true });
        ctx.globalCompositeOperation = "source-over";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        paintScratchCover(ctx, cssW, cssH);
        ctx.setTransform(1, 0, 0, 1, 0, 0);

        Object.assign(scratch, {
            canvas, ctx, w: canvas.width, h: canvas.height, dpr,
            brush: makeScratchBrush(Math.round(BRUSH_R * dpr)),
            drawing: false, cleared: 0, revealed: false, baseline: 1
        });
        scratch.baseline = measureScratchAlpha() || 1;
    }

    function scratchPoint(e) {
        const r = scratch.canvas.getBoundingClientRect();
        return {
            x: (e.clientX - r.left) * (scratch.w / r.width),
            y: (e.clientY - r.top) * (scratch.h / r.height)
        };
    }

    function scratchStamp(x0, y0, x1, y1) {
        const { ctx, brush, dpr } = scratch;
        const r = brush.width / 2;
        ctx.globalCompositeOperation = "destination-out";
        const dist = Math.hypot(x1 - x0, y1 - y0);
        const step = Math.max(2, r * 0.3);
        const n = Math.max(1, Math.ceil(dist / step));
        for (let i = 1; i <= n; i++) {
            const t = i / n;
            ctx.drawImage(brush, x0 + (x1 - x0) * t - r, y0 + (y1 - y0) * t - r);
        }
    }

    function scratchSpark(clientX, clientY) {
        if (reduceMotion) return;
        const now = performance.now();
        if (now - scratch.lastSpark < 70) return;
        scratch.lastSpark = now;
        const s = document.createElement("span");
        s.className = "trail-spark";
        s.textContent = pick(["✦", "♡", "✧", "✨"]);
        s.style.left = (clientX + Math.random() * 24 - 12) + "px";
        s.style.top = (clientY + Math.random() * 24 - 12) + "px";
        s.style.fontSize = (11 + Math.random() * 9) + "px";
        document.body.appendChild(s);
        s.addEventListener("animationend", () => s.remove());
    }

    function checkScratchProgress(force) {
        if (scratch.revealed || !scratch.ctx) return;
        const now = performance.now();
        if (!force && now - scratch.lastCheck < 90) return;
        scratch.lastCheck = now;
        scratch.cleared = Math.max(0, 1 - measureScratchAlpha() / scratch.baseline);
        if (scratch.cleared >= REVEAL_AT) revealScratchCard();
    }

    // Passou de 70%: o resto da capa derrete sozinho, com um brilho suave
    function revealScratchCard() {
        if (scratch.revealed) return;
        scratch.revealed = true;
        scratch.drawing = false;
        const letter = document.getElementById("letter");
        letter.classList.add("revealed");
        if (navigator.vibrate) navigator.vibrate([15, 40, 25]);
        const r = letter.getBoundingClientRect();
        emitParticles(r.left + r.width / 2, r.top + r.height / 2,
            { count: 14, minDist: 70, maxDist: 140, size: [16, 26] });
        scratch.hideTimer = setTimeout(() => { scratch.canvas.style.display = "none"; }, 1400);
    }

    (function bindScratchEvents() {
        const canvas = document.getElementById("scratch-canvas");

        canvas.addEventListener("pointerdown", e => {
            if (scratch.revealed || !scratch.ctx) return;
            e.preventDefault();
            canvas.setPointerCapture(e.pointerId);
            scratch.drawing = true;
            const p = scratchPoint(e);
            scratch.lx = p.x;
            scratch.ly = p.y;
            document.getElementById("letter").classList.add("scratched");
            scratchStamp(p.x, p.y, p.x, p.y);
            scratchSpark(e.clientX, e.clientY);
        });

        canvas.addEventListener("pointermove", e => {
            if (!scratch.drawing) return;
            const evs = (e.getCoalescedEvents && e.getCoalescedEvents()) || [];
            (evs.length ? evs : [e]).forEach(ev => {
                const p = scratchPoint(ev);
                scratchStamp(scratch.lx, scratch.ly, p.x, p.y);
                scratch.lx = p.x;
                scratch.ly = p.y;
            });
            scratchSpark(e.clientX, e.clientY);
            checkScratchProgress(false);
        });

        const stop = () => {
            if (!scratch.drawing) return;
            scratch.drawing = false;
            checkScratchProgress(true);
        };
        canvas.addEventListener("pointerup", stop);
        canvas.addEventListener("pointercancel", stop);
    })();

    // SERVICE WORKER
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registrado', reg))
                .catch(err => console.log('Erro no SW', err));
        });
    }

    updateGreeting();
    updateDailyMessage();
    calculateDaysTogether();
    setInterval(updateGreeting, 60000);

    // Se o app ficar aberto em segundo plano e virar o dia, atualiza ao voltar
    document.addEventListener("visibilitychange", () => {
        if (document.visibilityState !== "visible") return;
        updateGreeting();
        if (!messageScreen.classList.contains("unlocked")) updateDailyMessage();
        calculateDaysTogether();
    });

    // Alguns navegadores restauram o valor antigo do slider ao recarregar
    // a página (bfcache/autofill). Força ele a começar sempre do zero.
    slider.value = 0;
    document.documentElement.style.setProperty('--track-opacity', 0.25);
</script>
</body>
