<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Para Meu Amor">
    <link rel="apple-touch-icon" href="icone.png">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#170609">
    <link rel="manifest" href="manifest.json">

    <title>Para Meu Amor</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,600&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            /* Rosa & coral — paleta (baseada em #FF6863) */
            --bg-top: #481019;
            --bg-bottom: #170609;
            --rose: #FF6863;
            --rose-soft: #FFADA6;
            --rose-dim: rgba(255, 104, 99, 0.35);
            --ivory: #FFF3EF;
            --blush: #FFB9B2;
            --ink: #3a0908;

            --bg-gradient:
                radial-gradient(circle at 18% 12%, rgba(255, 104, 99, 0.16), transparent 42%),
                radial-gradient(circle at 88% 82%, rgba(255, 154, 140, 0.35), transparent 48%),
                linear-gradient(160deg, var(--bg-top) 0%, var(--bg-bottom) 100%);

            --track-opacity: 0.25;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-color: var(--bg-bottom);
            color: var(--ivory);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        h1, h2, h3 {
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.3px;
        }

        /* Divisor ornamental — motivo repetido em todas as telas */
        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 68%;
            max-width: 210px;
            margin: 14px auto 22px;
        }
        .ornament::before, .ornament::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--rose), transparent);
        }
        .ornament-dot {
            width: 6px;
            height: 6px;
            flex-shrink: 0;
            background: var(--rose);
            transform: rotate(45deg);
            box-shadow: 0 0 8px rgba(255, 104, 99, 0.65);
        }

        /* Brilho ambiente — camada única acima de tudo, sutil e não-interativa */
        .ambient-glow {
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            mix-blend-mode: screen;
            background:
                radial-gradient(circle at 28% 18%, rgba(255, 104, 99, 0.10), transparent 55%),
                radial-gradient(circle at 78% 86%, rgba(230, 199, 138, 0.07), transparent 50%);
            animation: ambientPulse 9s ease-in-out infinite alternate;
        }
        @keyframes ambientPulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        /* ===================== TELA 1 — BLOQUEIO ===================== */
        #lock-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            background: var(--bg-gradient);
            z-index: 1;
            text-align: center;
            gap: 5vh;
        }

        #greeting {
            font-size: 2.5rem;
            font-style: italic;
            font-weight: 600;
            color: var(--ivory);
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.6);
            line-height: 1.3;
            max-width: 90%;
            animation: pulseGlow 4s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.92; }
            100% { transform: scale(1.02); opacity: 1; }
        }

        .slider-wrapper {
            width: 100%;
            max-width: 290px;
            text-align: center;
            z-index: 10;
        }

        .slider-text {
            font-size: 0.95rem;
            color: var(--blush);
            margin-bottom: 18px;
            font-style: italic;
            font-weight: 300;
            letter-spacing: 1px;
            animation: slideHint 2.5s infinite ease-in-out;
        }

        @keyframes slideHint {
            0% { transform: translateX(-4px); opacity: 0.4; }
            50% { transform: translateX(4px); opacity: 0.9; }
            100% { transform: translateX(-4px); opacity: 0.4; }
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 56px;
            background: linear-gradient(90deg, rgba(255, 104, 99, var(--track-opacity)), rgba(255, 154, 140, var(--track-opacity)));
            border-radius: 30px;
            outline: none;
            transition: background 0.05s linear;
            box-shadow: inset 0 0 0 1px rgba(255, 104, 99, 0.25), 0 4px 20px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background-color: var(--rose);
            background-image:
                radial-gradient(circle at 34% 30%, var(--rose-soft), var(--rose) 60%, #cc3f3a 100%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="%233a0908"><path d="M12 21s-7.5-4.6-10-9.3C.6 8 2.4 4.5 6 4.5c2 0 3.6 1.1 4.5 2.6C11.4 5.6 13 4.5 15 4.5c3.6 0 5.4 3.5 4 7.2C19.5 16.4 12 21 12 21z"/></svg>');
            background-repeat: no-repeat;
            background-position: center, center;
            background-size: cover, 23px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.55), 0 0 0 3px rgba(247, 236, 217, 0.08);
            transition: transform 0.1s;
        }

        .kitty-container {
            position: absolute;
            bottom: 25px;
            width: 85px;
            height: auto;
            opacity: 0.72;
            pointer-events: none;
            z-index: 5;
        }

        .kitty-container::before {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 72px;
            background: radial-gradient(circle, rgba(255, 104, 99, 0.32), transparent 70%);
            filter: blur(5px);
            z-index: -1;
        }

        .kitty-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        .kitty-right img {
            transform: scaleX(-1);
        }

        .kitty-left {
            left: 20px;
            transform-origin: bottom center;
            animation: smoothTiltLeft 5s infinite alternate ease-in-out;
        }
        .kitty-right {
            right: 20px;
            transform-origin: bottom center;
            animation: smoothTiltRight 5s infinite alternate ease-in-out;
        }

        @keyframes smoothTiltLeft {
            0% { transform: rotate(-22deg); }
            100% { transform: rotate(22deg); }
        }

        @keyframes smoothTiltRight {
            0% { transform: rotate(22deg); }
            100% { transform: rotate(-22deg); }
        }

        /* ===================== TELA 2 — MENSAGEM ===================== */
        #message-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            background-color: var(--bg-bottom);
            color: var(--ivory);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px;
            text-align: center;

            transform: translateY(100%);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            border-top-left-radius: 35px;
            border-top-right-radius: 35px;
            box-shadow: 0 -15px 40px rgba(0, 0, 0, 0.7);
        }

        #message-screen.unlocked {
            transform: translateY(0);
            border-radius: 0;
        }

        .message-content {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s ease 0.4s, transform 0.8s ease 0.4s;
            max-width: 320px;
        }

        #message-screen.unlocked .message-content {
            opacity: 1;
            transform: translateY(0);
        }

        .message-content h2 {
            font-size: 2rem;
            font-style: italic;
            color: var(--rose-soft);
        }

        .message-content p {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.4rem;
            line-height: 1.65;
            color: var(--ivory);
            font-weight: 500;
        }

        /* ===================== BOTÕES ===================== */
        .close-btn {
            margin-top: 26px;
            padding: 12px 32px;
            background: rgba(255, 104, 99, 0.08);
            border: 1.5px solid var(--rose);
            color: var(--ivory);
            border-radius: 25px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.92rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .close-btn:active {
            background: var(--rose);
            color: var(--ink);
            transform: scale(0.96);
        }

        .close-btn.accent-btn {
            background: linear-gradient(135deg, var(--rose-soft), var(--rose) 70%);
            color: var(--ink);
            font-weight: 600;
        }
        .close-btn.accent-btn:active {
            filter: brightness(0.92);
            transform: scale(0.96);
        }

        /* ===================== TELA 3 — CONTADOR ===================== */
        #counter-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            background-color: var(--bg-bottom);
            color: var(--ivory);
            z-index: 30;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 35px;
            text-align: center;

            transform: translateY(100%);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #counter-screen.active {
            transform: translateY(0);
        }

        .photo-collage-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 31;
            opacity: 0.16;
            pointer-events: none;
        }

        .collage-card {
            position: absolute;
        }

        .collage-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: block;
            transform-origin: center center;
            filter: sepia(0.25) saturate(1.1) hue-rotate(-6deg) brightness(0.92);
        }

        .photo-collage-bg .collage-card:nth-child(odd) img {
            animation: slowPhotoTiltLeft 8s infinite alternate ease-in-out;
        }
        .photo-collage-bg .collage-card:nth-child(even) img {
            animation: slowPhotoTiltRight 10s infinite alternate ease-in-out;
        }

        @keyframes slowPhotoTiltLeft {
            0% { transform: rotate(-7deg); }
            100% { transform: rotate(7deg); }
        }

        @keyframes slowPhotoTiltRight {
            0% { transform: rotate(7deg); }
            100% { transform: rotate(-7deg); }
        }

        .img1 { top: 8%; left: -10px; transform: rotate(-15deg); width: 120px; }
        .img2 { top: 12%; right: -15px; transform: rotate(12deg); width: 105px; }
        .img3 { bottom: 28%; left: -20px; transform: rotate(18deg); width: 115px; }
        .img4 { bottom: 25%; right: -10px; transform: rotate(-12deg); width: 130px; }

        .counter-container {
            z-index: 35;
            max-width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .counter-title {
            font-size: 2.1rem;
            font-style: italic;
            color: var(--rose-soft);
        }

        .counter-box {
            position: relative;
            background: rgba(72, 16, 25, 0.32);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid var(--rose-dim);
            padding: 36px 26px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
            margin-bottom: 30px;
            width: 100%;
        }

        /* cantos dourados — moldura de "medalhão" */
        .counter-box::before, .counter-box::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 1.5px solid var(--rose);
            opacity: 0.8;
        }
        .counter-box::before {
            top: 8px; left: 8px;
            border-right: none; border-bottom: none;
        }
        .counter-box::after {
            bottom: 8px; right: 8px;
            border-left: none; border-top: none;
        }

        .counter-text {
            font-size: 1.2rem;
            line-height: 1.8;
            font-weight: 400;
            font-family: 'Poppins', sans-serif;
        }

        .days-highlight {
            font-family: 'Playfair Display', serif;
            font-size: 2.35rem;
            font-weight: 600;
            display: block;
            margin: 6px 0 2px;
            line-height: 1.3;
            background: linear-gradient(90deg, var(--rose-soft), var(--rose) 55%, var(--rose-soft));
            -webkit-background-clip: text;
            background-clip: text;
            color: var(--rose-soft);
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 18px rgba(255, 104, 99, 0.25);
        }

        .counter-actions {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .counter-actions .close-btn {
            margin-top: 0;
        }

        /* ===================== TELA 4 — GALERIA ===================== */
        #gallery-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient);
            background-color: var(--bg-bottom);
            color: var(--ivory);
            z-index: 40;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 26px 22px;
            text-align: center;

            transform: translateY(100%);
            transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #gallery-screen.active {
            transform: translateY(0);
        }

        .gallery-header {
            flex-shrink: 0;
        }

        .gallery-title {
            font-size: 1.9rem;
            font-style: italic;
            color: var(--rose-soft);
        }

        .gallery-subtitle {
            font-size: 0.85rem;
            color: var(--blush);
            font-weight: 300;
            letter-spacing: 0.3px;
            margin-top: -6px;
        }

        .gallery-month-select {
            appearance: none;
            -webkit-appearance: none;
            background: rgba(255, 104, 99, 0.10);
            border: 1.5px solid var(--rose-dim);
            color: var(--rose-soft);
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.3px;
            padding: 10px 34px 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            margin: 8px 0 10px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14" height="14" fill="%23ffada6"><path d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 14px center;
        }
        .gallery-month-select:focus {
            outline: none;
            border-color: var(--rose);
        }
        .gallery-month-select option {
            background: var(--bg-bottom);
            color: var(--ivory);
        }

        .gallery-empty {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.1rem;
            color: var(--blush);
            padding: 50px 10px;
            text-align: center;
        }

        .gallery-list {
            flex: 1;
            width: 100%;
            max-width: 380px;
            overflow-y: auto;
            margin: 6px 0 18px;
            padding: 4px 6px;
            text-align: left;
        }

        .gallery-list::-webkit-scrollbar {
            width: 4px;
        }
        .gallery-list::-webkit-scrollbar-thumb {
            background: rgba(255, 104, 99, 0.4);
            border-radius: 4px;
        }

        .gallery-entry {
            display: flex;
            gap: 14px;
            padding: 16px 4px;
            border-bottom: 1px solid rgba(255, 104, 99, 0.15);
        }
        .gallery-entry:last-child {
            border-bottom: none;
        }

        .gallery-badge {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 104, 99, 0.12);
            border: 1px solid rgba(255, 104, 99, 0.55);
            color: var(--rose-soft);
            font-family: 'Playfair Display', serif;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-entry-content {
            flex: 1;
            min-width: 0;
        }

        .gallery-date {
            display: block;
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--blush);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .gallery-text {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 1.12rem;
            line-height: 1.5;
            color: var(--ivory);
        }

        #gallery-screen .close-btn {
            margin-top: 0;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <div id="lock-screen">
        <h1 id="greeting">Olá, meu amor!</h1>

        <div class="slider-wrapper">
            <div class="slider-text">deslize para ler</div>
            <input type="range" id="unlock-slider" min="0" max="100" value="0">
        </div>

        <div class="kitty-container kitty-left">
            <img src="hellokitty.png" alt="Hello Kitty e Daniel">
        </div>

        <div class="kitty-container kitty-right">
            <img src="hellokitty.png" alt="Hello Kitty e Daniel">
        </div>
    </div>

    <div id="message-screen">
        <div class="message-content">
            <h2>Mensagem de Hoje</h2>
            <div class="ornament"><span class="ornament-dot"></span></div>
            <p id="daily-message">Carregando nosso momento...</p>
            <button class="close-btn" onclick="goToCounterScreen()">Voltar</button>
        </div>
    </div>

    <div id="counter-screen">
        <div class="photo-collage-bg">
            <div class="collage-card img1"><img src="foto1.jpg" onerror="this.src='hellokitty.png'"></div>
            <div class="collage-card img2"><img src="hk_foto1.png" onerror="this.src='hellokitty.png'"></div>
            <div class="collage-card img3"><img src="foto2.jpg" onerror="this.src='hellokitty.png'"></div>
            <div class="collage-card img4"><img src="hk_foto2.png" onerror="this.src='hellokitty.png'"></div>
        </div>

        <div class="counter-container">
            <h2 class="counter-title">Nosso Amor</h2>
            <div class="ornament"><span class="ornament-dot"></span></div>

            <div class="counter-box">
                <p class="counter-text">
                    Namorando há
                    <span id="days-count" class="days-highlight">Calculando tempo...</span>
                </p>
            </div>

            <div class="counter-actions">
                <button class="close-btn accent-btn" onclick="goToGallery()">Galeria</button>
                <button class="close-btn" onclick="resetToLock()">Início</button>
            </div>
        </div>
    </div>

    <div id="gallery-screen">
        <div class="gallery-header">
            <h2 class="gallery-title">Nossas Palavras</h2>
            <div class="ornament"><span class="ornament-dot"></span></div>
            <select class="gallery-month-select" id="gallery-month-select"></select>
            <p class="gallery-subtitle" id="gallery-subtitle">Tudo que já te disse</p>
        </div>

        <div class="gallery-list" id="gallery-list"></div>

        <button class="close-btn" onclick="closeGallery()">Voltar</button>
    </div>

    <div class="ambient-glow"></div>

<script>
    // 1. SAUDAÇÃO TIMELINE
    function updateGreeting() {
        const now = new Date();
        const hours = now.getHours();
        const minutes = now.getMinutes();
        const timeInDecimal = hours + (minutes / 60);

        let greeting = "Boa noite Manuzinha!";

        if (timeInDecimal > 5.0 && timeInDecimal <= 12.0) {
            greeting = "Bom dia Manuzinha!";
        } else if (timeInDecimal > 12.0 && timeInDecimal <= 19.0) {
            greeting = "Boa tarde Manuzinha!";
        }
        document.getElementById("greeting").innerText = greeting;
    }

    // 2. MENSAGENS — uma por dia do mês
    // Dias 1-21 ainda sem frase: deixei como string vazia ("") para cair no fallback
    // Dias 22-31 com frases reais
    const messages = [
        /* Dia  1 */ "Não me canso de você nunca Manu, vai ter que me aguentar até ficarmos velhinhos.",
        /* Dia  2 */ "Oi nenenzinha, passar essas férias ao seu lado foi a melhor coisa que poderia ter me acontecido.",
        /* Dia  3 */ "Bebezinha, não fique triste que acabou nossas férias, fique feliz porque aconteceu e ficamos juntinhos e aproveitarmos bastante.",
        /* Dia  4 */ "Ei gatinha! Vou estar sempre com você, mesmo que não seja em corpo presente.",
        /* Dia  5 */ "Oiii! Ta todo mundo ferrado, pelo menos vamos ficar ferrados juntos.",
        /* Dia  6 */ "Manuzinha! Você é luz pro meu mundo, quando estou com voce consigo ver as coisas mais claramente.",
        /* Dia  7 */ "Oi amoreco, seus peitos me fez perceber que eu consigo focar em duas coisas ao mesmo tempo.",
        /* Dia  8 */ "Pra mulher que eu amo, aquele abraço gostooooso!!!",
        /* Dia  9 */ "Pensando em você o tempo todo, é isso que eu sempre estou fazendo.",
        /* Dia 10 */ "Dormida virtual, até que é bem legal.",
        /* Dia 11 */ "Oi minha gatinha, cada dia estamos mais perto de nos casarmos, e cada dia fico mais ansioso!",
        /* Dia 12 */ "Quem me conhece sabe que eu mudei muito depois que comecei a namorar com você, e pra melhor!",
        /* Dia 13 */ "O meu dia só começa depois que você me da um beijo.",
        /* Dia 14 */ "Eu amo cada detalhe seu manu, e me apaixono cada dia mais.",
        /* Dia 15 */ "Olá, temos um recado do Paulo pra você Manu, ele te ama muito e quer você junto com ele sempre!",
        /* Dia 16 */ "A mulher mais linda do mundo é você Manu, a mais apaixonante, a mais gostosa e a que merece mais coisas boas é você a minha bebezona.",
        /* Dia 17 */ "",

        /* Dia 27 */ "",

        /* Dia 29 */ "",
        /* Dia 30 */ "",
        /* Dia 31 */ "",
    ];

    // Mensagem especial de 12 de junho (Dia dos Namorados) — mesma fonte usada
    // tanto na tela do dia quanto na Galeria, então qualquer alteração aqui
    // aparece automaticamente nas duas telas.
    const SPECIAL_DATES = {
        "5-12": "Nosso primeiro dia dos namorados juntos, acho que você deve imaginar o quanto eu pensava nisso durante todo aquele tempo que estávamos nos conhecendo. Eu não acreditaria se me contassem que um dia estaria vivendo isso tudo com você, e não poderia ser melhor, com você tudo parece perfeito. Manuela, meu corpo te deseja, meu coração pulsa por você e minha alma sente falta da sua quando ficamos longe. Eu te amo, e amo dividir a vida com você, hoje amanhã e sempre."
    };

    // Fonte única da verdade: dado um dia (1-31) e mês (0-11), devolve a frase
    // correspondente. Usada tanto pela tela diária quanto pela Galeria — por
    // isso qualquer frase nova entra automaticamente na Galeria também.
    function resolveMessageForDate(day, month) {
        const key = `${month}-${day}`;
        if (SPECIAL_DATES[key]) {
            return SPECIAL_DATES[key];
        }
        const index = day - 1;
        return (messages[index] !== undefined && messages[index] !== "")
            ? messages[index]
            : "Eu te amo, Manu. ❤️";
    }

    function updateDailyMessage() {
        const now = new Date();
        const mensagem = resolveMessageForDate(now.getDate(), now.getMonth());
        document.getElementById("daily-message").innerHTML = mensagem;
    }

    // 3. CONTADOR DE DIAS (Anos, Meses e Dias)
    function calculateDaysTogether() {
        const startDate = new Date("2026-04-25T00:00:00");
        const today = new Date();

        startDate.setHours(0,0,0,0);
        today.setHours(0,0,0,0);

        let years = today.getFullYear() - startDate.getFullYear();
        let months = today.getMonth() - startDate.getMonth();
        let days = today.getDate() - startDate.getDate();

        if (days < 0) {
            months--;
            const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
            days += prevMonth.getDate();
        }

        if (months < 0) {
            years--;
            months += 12;
        }

        let parts = [];

        if (years > 0) {
            parts.push(years === 1 ? "1 Ano" : `${years} Anos`);
        }
        if (months > 0) {
            parts.push(months === 1 ? "1 mês" : `${months} meses`);
        }
        if (days > 0) {
            parts.push(days === 1 ? "1 dia" : `${days} dias`);
        }

        let resultText = "";
        if (parts.length === 1) {
            resultText = parts[0];
        } else if (parts.length === 2) {
            resultText = parts[0] + " e " + parts[1];
        } else if (parts.length === 3) {
            resultText = parts[0] + ", " + parts[1] + " e " + parts[2];
        } else {
            resultText = "0 dias";
        }

        document.getElementById("days-count").innerText = resultText;
    }

    // 3b. GALERIA
    const MONTH_NAMES = ["janeiro","fevereiro","março","abril","maio","junho",
                          "julho","agosto","setembro","outubro","novembro","dezembro"];

    // MESES PASSADOS — preencha aqui manualmente.
    // Chave: "AAAA-MM" (mês com 2 dígitos). Valor: objeto { diaDoMês: "frase" }.
    // Só precisa colocar os dias que você quiser guardar — não precisa dos 31.
    // O mês ATUAL nunca precisa entrar aqui: ele é montado sozinho a partir
    // do array `messages` lá em cima, então continua 100% automático.
    // Exemplo (apague o comentário e edite com suas frases reais):
    // "2026-04": {
    //     25: "Foi hoje que começamos a namorar, o dia mais feliz da minha vida.",
    //     30: "Uma semana juntos e já não consigo imaginar a vida sem você."
    // },
    const pastMonthsArchive = {
        "2026-06": {

            22: "Oi bebê, você é o motivo que me faz levantar da cama todos os dias, pra sempre tentar ser uma pessoa melhor, estudar pra podermos viver confortável no futuro. O meu sonho ainda é viver junto com você.",
            23: "Oiii Manu! Você é a pessoa mais importante da minha vida, por você eu bebo o mar de canudinho.",
            24: "Manuuu! Eu te amo minha gatinha, sabe aquela vontade de viver o resto da vida com o seu amor? Tenho toda hora.",
            25: "Oi Manu I love u! Meus dias são mais felizes quando passo eles com você.",
            26: "Pode ter certeza que onde você estiver, é onde eu quero estar.",
            27: "Sinto muito por não ficar tanto tempo com você durante a semana meu amor. Um dia vamos poder ficar juntinhos todo dia o dia todo sem preocupações.",
            28: "Minha paixão é você Manu, sou viciado em ti dos seus pés a cabeça, principalmente os pés.",
            29: "EU TE AMO MANU! Gosto de você até do avesso, besaum!.",
            30: "Oii Manuzinha, quero que nossos filhos venham perfeitos igual a você.",
            31: "Quero ficar olhando pro seu rosto o dia todo, e quando for dormir eu quero ver no sonho também.",
        },
        "2026-07": {
            01: "Quero ficar olhando pro seu rosto o dia todo, e quando for dormir eu quero ver no sonho também.",
            02: "Bright are the stars that shine, dark is the sky, i know this love of mine will never die, and i love her.",
            03: "Bebezinha, você é só minha. Obrigado por sempre estar comigo quando eu preciso, pode ter certeza que eu faço o mesmo por você.",
            04: "Oi Manuzinha, rosas são vermelhas, violetas são azuis, esse seu rostinho é o que me seduz :P",
            05: "Ei Manuzoca, sabe o que é melhor do que uma beijoca Duas beijocas.",
            06: "Manulinda, você é Lagoona do meu Gil rs.",
            07: "Oi amoreco, um beijão no seu coração, e outro mais embaixo, bem mais embaixo.",
            20: "Oiii meu nenê, eu te amo eternamente, um dia vamos ser casados, mas você vai ser pra sempre minha namorada.",
            22: "Oi bebê, você é o motivo que me faz levantar da cama todos os dias, pra sempre tentar ser uma pessoa melhor, estudar pra podermos viver confortável no futuro. O meu sonho ainda é viver junto com você.",
            23: "Oi minha princesa, você é única, ficaremos juntos eternamente. Cada experiência com você é especial.",
            24: "Eu te amo minha boneca, sem você não sou nada. Queria ser a pele do seu corpo, pra estar junto com você a tanto tempo.",
            25: "Oi Manu I love u! Meus dias são mais felizes quando passo eles com você.",
            26: "Pode ter certeza que onde você estiver, é onde eu quero estar.",
            27: "Minha maior paixão é você Manu, cada segundo que passo ao seu lado é um sonho realizado. Ficar com você é a melhor coisa do mundo.",
            28: "Oii bebezinha, obrigado por estar sempre comigo quando eu preciso, eu amo você e espero que eu possa sempre te ajudar como você faz comigo.",
            29: "Oi minha gatinha linda, tenho um vício em você, me tremo todo so de pensar em ficar longe de ti Manu.",
            30: "Bebezinha linda do Paulo, eu te amo de hoje até o infinito. 'When im not with you, think of you always'.",
            31: "Eu quero passar minha vida toda ao seu lado Manu, cada segundo de cada minuto.",
        },
    };

    function currentMonthKey() {
        const now = new Date();
        return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
    }

    // Mês atual sempre primeiro, depois os meses do arquivo, do mais recente
    // pro mais antigo.
    function getAvailableMonths() {
        const curKey = currentMonthKey();
        const archiveKeys = Object.keys(pastMonthsArchive).filter(k => k !== curKey);
        archiveKeys.sort((a, b) => b.localeCompare(a));
        return [curKey, ...archiveKeys];
    }

    function monthLabel(key) {
        const [year, month] = key.split("-").map(Number);
        const name = MONTH_NAMES[month - 1];
        return `${name.charAt(0).toUpperCase()}${name.slice(1)} ${year}`;
    }

    function populateMonthSelect() {
        const select = document.getElementById("gallery-month-select");
        const curKey = currentMonthKey();
        const months = getAvailableMonths();
        select.innerHTML = months.map(key => {
            const label = monthLabel(key) + (key === curKey ? " (atual)" : "");
            return `<option value="${key}">${label}</option>`;
        }).join("");
    }

    function updateGallerySubtitle(key) {
        const curKey = currentMonthKey();
        const [year, month] = key.split("-").map(Number);
        const monthName = MONTH_NAMES[month - 1];
        if (key === curKey) {
            document.getElementById("gallery-subtitle").innerText =
                `Tudo que já te disse em ${monthName}`;
        } else {
            document.getElementById("gallery-subtitle").innerText =
                `Nossas palavras de ${monthName} de ${year}`;
        }
    }

    // Monta a lista de frases do mês selecionado. Pro mês atual, usa a mesma
    // fonte da tela do dia (resolveMessageForDate), então frases novas
    // aparecem sozinhas. Pros meses passados, usa o que estiver em
    // pastMonthsArchive.
    function renderGalleryForMonth(key) {
        const list = document.getElementById("gallery-list");
        const curKey = currentMonthKey();
        const [year, month] = key.split("-").map(Number);

        updateGallerySubtitle(key);

        let entries = [];

        if (key === curKey) {
            const today = new Date().getDate();
            for (let d = today; d >= 1; d--) {
                entries.push({ day: d, text: resolveMessageForDate(d, month - 1) });
            }
        } else {
            const monthData = pastMonthsArchive[key] || {};
            const days = Object.keys(monthData).map(Number).sort((a, b) => b - a);
            entries = days.map(d => ({ day: d, text: monthData[d] }));
        }

        if (entries.length === 0) {
            list.innerHTML = `<p class="gallery-empty">Nenhuma frase guardada esse mês ainda.</p>`;
            return;
        }

        list.innerHTML = entries.map(e => `
            <div class="gallery-entry">
                <div class="gallery-badge">${e.day}</div>
                <div class="gallery-entry-content">
                    <span class="gallery-date">${e.day} de ${MONTH_NAMES[month - 1]}</span>
                    <p class="gallery-text">${e.text}</p>
                </div>
            </div>`).join("");
    }

    // 4. INTERAÇÕES E TRANSIÇÕES DE INTERFACE
    const slider = document.getElementById("unlock-slider");
    const messageScreen = document.getElementById("message-screen");
    const counterScreen = document.getElementById("counter-screen");
    const galleryScreen = document.getElementById("gallery-screen");

    slider.addEventListener("input", function() {
        const val = this.value;
        const maxOpacity = 0.25;
        const dynamicOpacity = ((100 - val) / 100) * maxOpacity;
        document.documentElement.style.setProperty('--track-opacity', dynamicOpacity);

        if (val > 95) {
            unlockScreen();
        }
    });

    function resetSlider() {
        if (slider.value <= 95) {
            let val = parseInt(slider.value);
            const interval = setInterval(() => {
                if (val > 0) {
                    val -= 12;
                    if (val < 0) val = 0;
                    slider.value = val;
                    const dynamicOpacity = ((100 - val) / 100) * 0.25;
                    document.documentElement.style.setProperty('--track-opacity', dynamicOpacity);
                } else {
                    clearInterval(interval);
                }
            }, 10);
        }
    }

    slider.addEventListener("change", resetSlider);
    slider.addEventListener("touchend", resetSlider);

    function unlockScreen() {
        messageScreen.classList.add("unlocked");
        slider.value = 100;
        document.documentElement.style.setProperty('--track-opacity', 0);
        if (navigator.vibrate) navigator.vibrate(20);
    }

    function goToCounterScreen() {
        messageScreen.classList.remove("unlocked");
        setTimeout(() => {
            calculateDaysTogether();
            counterScreen.classList.add("active");
        }, 500);
    }

    function resetToLock() {
        counterScreen.classList.remove("active");
        setTimeout(() => {
            slider.value = 0;
            document.documentElement.style.setProperty('--track-opacity', 0.25);
        }, 600);
    }

    function goToGallery() {
        populateMonthSelect();
        const curKey = currentMonthKey();
        const monthSelect = document.getElementById("gallery-month-select");
        monthSelect.value = curKey;
        renderGalleryForMonth(curKey);
        galleryScreen.classList.add("active");
    }

    function closeGallery() {
        galleryScreen.classList.remove("active");
    }

    document.getElementById("gallery-month-select").addEventListener("change", function() {
        renderGalleryForMonth(this.value);
    });

    // SERVICE WORKER
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW registrado', reg))
                .catch(err => console.log('Erro no SW', err));
        });
    }

    updateGreeting();
    updateDailyMessage();
    calculateDaysTogether();
    setInterval(updateGreeting, 60000);
</script>
